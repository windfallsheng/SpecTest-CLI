# SpecTest GitLab CI 模板
# 用法：复制到 .gitlab-ci.yml 或 include 引用，按需调整 ITERATION / ENV / 密钥
# 三层链：静态验证（零成本）→ 契约执行（--env 指向目标环境）→ gate 门禁
stages:
  - verify
  - contract
  - gate

variables:
  ITERATION: "Iteration-003-xxx"   # 期次名称
  ENV: "sit"                       # 契约执行环境（sit/uat/test，逗号分隔 = 环境矩阵）

verify:
  stage: verify
  image: node:20
  script:
    - npm install -g spectest-cli
    - spectest verify -i $ITERATION

contract:
  stage: contract
  image: node:20
  script:
    - npm install -g spectest-cli
    # SIT 冒烟：只跑 P0 契约用例，失败重试 1 次抗 flaky
    - spectest contract-run -i $ITERATION --env $ENV --priority high --retry 1

gate:
  stage: gate
  image: node:20
  script:
    - npm install -g spectest-cli
    - spectest gate -i $ITERATION --json
  allow_failure: false
